name: Release Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 1.0.1)
        required: true
        default: '1.0.1'

permissions:
  contents: write

concurrency:
  group: attendance-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: aopao/chinese-gushiwen
          ref: 34956ae167a585986d51bcc8dbd17a9f1d8e4ae9
          path: Attendance/Resources/chinese-gushiwen
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build, inspect, install and smoke test
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./packaging/build.ps1 -Version $env:RELEASE_VERSION
      - name: Publish verified installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:RELEASE_VERSION"
          gh release create $tag dist/AttendanceInstaller.exe dist/SHA256SUMS.txt --target $env:GITHUB_SHA --title "Attendance $tag" --notes-file packaging/notes.md --draft
          if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release' }
